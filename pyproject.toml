[project]
name = "okto-pulse"
version = "0.3.1"
description = "Okto Pulse — spec-driven project management with AI agents via MCP. Local-first, single command setup."
requires-python = ">=3.11"
license = {text = "Elastic-2.0"}
authors = [
    {name = "Okto Labs", email = "dev@oktolabs.ai"},
]
keywords = [
    "kanban", "project-management", "mcp", "ai-agents", "spec-driven",
    "claude", "cursor", "windsurf", "developer-tools",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Office/Business :: Scheduling",
    "Framework :: FastAPI",
    "Operating System :: OS Independent",
]
dependencies = [
    "okto-pulse-core>=0.3.1,<1.0.0",
    # 0.137.0 regressed include_router for empty collection paths; 0.137.1 fixed it.
    "fastapi>=0.109.0,!=0.137.0,<1.0.0",
    "starlette>=0.35.0,<1.0.0",
    "pydantic>=2.12.0,<2.14",
    "pydantic-settings>=2.1.0,<3.0.0",
    "python-multipart>=0.0.6,<1.0.0",
    "sqlalchemy[asyncio]>=2.0.0,<3.0.0",
    "aiosqlite>=0.19.0,<1.0.0",
    "anyio>=4.0.0,<5.0.0",
    "httpx>=0.27.0,<1.0.0",
    "fastmcp>=2.0.0,<3.0.0",
    "mcp>=1.20.0,<2.0.0",
    "uvicorn[standard]>=0.27.0,<1.0.0",
    "wsproto>=1.2.0,<2.0.0",
    "apscheduler>=3.10.0,<4.0.0",
    "ladybug>=0.16.0,<0.17.0",
    "requests>=2.32.0,<3.0.0",
    "filelock>=3.16.0,<4.0.0",
    "chardet>=3.0.2,<8.0.0",
    "sentence-transformers>=2.5.0,<6.0.0",
]

[project.urls]
Homepage = "https://github.com/OktoLabsAI/okto-pulse"
Documentation = "https://github.com/OktoLabsAI/okto-pulse#readme"
Repository = "https://github.com/OktoLabsAI/okto-pulse"
Issues = "https://github.com/OktoLabsAI/okto-pulse/issues"
Changelog = "https://github.com/OktoLabsAI/okto-pulse/blob/main/CHANGELOG.md"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.scripts]
okto-pulse = "okto_pulse.community.cli:main"
okto-pulse-saas-closure = "okto_pulse.community.saas_closure:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/okto_pulse"]
artifacts = [
    "src/okto_pulse/community/frontend_dist/assets/*.png",
    "src/okto_pulse/community/banner.txt",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/okto_pulse",
    "README.md",
    "LICENSE",
    "CLA.md",
    "TRADEMARKS.md",
]
artifacts = ["src/okto_pulse/community/frontend_dist/assets/*.png"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Keep each async test fixture on the test's function-scoped loop.  A session
# default lets loop-bound clients and database runtimes leak between tests and
# eventually fail during teardown with ``Event loop is closed``.
asyncio_default_fixture_loop_scope = "function"
markers = [
    "e2e: end-to-end integration tests excluded from the fast suite",
    "slow: long-running local runtime tests",
    "stress: destructive or high-volume stress tests",
]
