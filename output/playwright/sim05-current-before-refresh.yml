                      - paragraph [ref=f3e611]: "Plano de verificação da aplicação fictícia. Recuperar os ACs e seus perfis pelo contexto full/all antes da execução. Implementar o método declarado, observar os oráculos e registrar evidência real; cenários ainda NÃO EXECUTADOS. Contrato — Persistência de transação: Duas conexões SQLite isoladas, reserva original v1 e coleta das três tabelas. → Executar commit válido, falha após save, chaves duplicadas e CAS obsoleto. → Ao confirmar uma transação, reserva, histórico e recibo tornam-se visíveis juntos; falha antes do commit preserva o estado anterior. Duas escritas com mesmo ator/operação/chave não persistem dois recibos; CAS obsoleto não sobrescreve reserva. SQL e exceções nativas ficam no adaptador. Contrato — ReservationUnitOfWork: Contrato completo com adaptador real e fake; A/B, recibo ausente/existente e transações de leitura/escrita. → Exercitar todas as14 operações; verificar consultas isoladas, null/not_found, CAS0/atual/obsoleto, escrita em leitura, rollback,commit e reutilização de handle encerrado. → begin_read/write retorna handle; get/get_room ausentes retornam null, read_history alheio/inexistente retorna not_found, get_receipt usa ator/operação/chave. save com expected_version=0 cria v1; CAS válido incrementa1, obsoleto recusa. save/append_history/put_receipt em leitura e uso de handle encerrado são recusados. Commit persiste os três registros; rollback descarta os três; replay usa recibo original sem regravar."
