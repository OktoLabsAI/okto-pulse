name: CI

# PR + main CI for okto-pulse.
#
# Aligned with the project's testing methodology: behavioral correctness is
# gated by the release pipeline (Docker smoke + MCP replay on tag push).
# This workflow is only an early signal that the Dockerfile still builds
# end-to-end given the current sibling-repo state.
#
# Sibling-repo policy: prefer a core branch with the same name as the pulse
# PR/branch (matches the way releases couple the two repos), fall back to
# core's main if no such branch exists. This prevents the "PR has version
# X.Y.Z but core@main is at X.Y.Z-1" dep-conflict failure that the naive
# `ref: main` produced.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-verify:
    name: docker build verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OKTO_PULSE_CORE_REPO: ${{ github.workspace }}/okto-pulse-core

    steps:
      - name: Checkout okto-pulse
        uses: actions/checkout@v6
        with:
          path: okto-pulse

      - name: Determine matching okto-pulse-core branch
        id: core_ref
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pass branch name through env var instead of inline interpolation
          # to avoid script-injection via attacker-controlled branch names.
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if gh api "repos/OktoLabsAI/okto-pulse-core/branches/${BRANCH}" --silent 2>/dev/null; then
            echo "Using matching core branch: ${BRANCH}"
            echo "ref=${BRANCH}" >> "$GITHUB_OUTPUT"
          else
            echo "No matching core branch (${BRANCH}), falling back to main"
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout okto-pulse-core @ ${{ steps.core_ref.outputs.ref }}
        uses: actions/checkout@v6
        with:
          repository: OktoLabsAI/okto-pulse-core
          ref: ${{ steps.core_ref.outputs.ref }}
          path: okto-pulse-core
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            okto-pulse-core/pyproject.toml
            okto-pulse/pyproject.toml

      - name: F16 SaaS closure ratchet
        run: |
          python -m pip install --upgrade pip
          pip install -e okto-pulse-core -e okto-pulse pytest pytest-asyncio build uv
          pytest --noconftest -q okto-pulse-core/tests/test_f16_saas_closure_report.py okto-pulse/tests/test_f16_saas_closure.py
          okto-pulse-saas-closure --core-repo okto-pulse-core --community-repo okto-pulse --format text

      - name: Full Community suite
        run: pytest -q -m "not e2e and not stress" okto-pulse/tests

      - name: Build isolated wheels
        run: |
          python -m build --wheel --outdir /tmp/f16-dist/core okto-pulse-core
          python -m build --wheel --outdir /tmp/f16-dist/community okto-pulse

      - name: Verify Core wheel without Community
        run: |
          python -m venv /tmp/f16-core
          /tmp/f16-core/bin/pip install /tmp/f16-dist/core/*.whl pytest pytest-asyncio
          cd /tmp
          /tmp/f16-core/bin/python - <<'PY'
          import importlib
          import pkgutil
          import sys
          import okto_pulse.core

          forbidden = ("fastapi", "starlette", "sqlalchemy", "aiosqlite", "okto_pulse.community")
          modules = []
          for item in pkgutil.walk_packages(
              okto_pulse.core.__path__, okto_pulse.core.__name__ + "."
          ):
              importlib.import_module(item.name)
              modules.append(item.name)
          bad = sorted(
              name for name in sys.modules
              if any(name == token or name.startswith(token + ".") for token in forbidden)
          )
          assert not bad, bad
          print(f"core-wheel-imports={len(modules)} forbidden-loaded=0")
          PY
          /tmp/f16-core/bin/python -m pytest --noconftest -q \
            "$GITHUB_WORKSPACE/okto-pulse-core/tests/test_f01_repository_domain_ports.py" \
            "$GITHUB_WORKSPACE/okto-pulse-core/tests/test_f02_fake_saas_uow.py" \
            "$GITHUB_WORKSPACE/okto-pulse-core/tests/test_f02_uow_session_boundary.py" \
            "$GITHUB_WORKSPACE/okto-pulse-core/tests/test_f03_realm_scope_contract.py" \
            "$GITHUB_WORKSPACE/okto-pulse-core/tests/test_f05_card_transition_policy.py" \
            "$GITHUB_WORKSPACE/okto-pulse-core/tests/test_f05_domain_event_delivery.py" \
            "$GITHUB_WORKSPACE/okto-pulse-core/tests/test_f05_queue_health_policy.py" \
            "$GITHUB_WORKSPACE/okto-pulse-core/tests/test_f05_service_ownership.py" \
            "$GITHUB_WORKSPACE/okto-pulse-core/tests/test_f05_spec_materialization_policy.py" \
            "$GITHUB_WORKSPACE/okto-pulse-core/tests/test_f06_rebuild_processor.py" \
            "$GITHUB_WORKSPACE/okto-pulse-core/tests/test_f09_graph_neutral_ports.py" \
            "$GITHUB_WORKSPACE/okto-pulse-core/tests/test_f10_worker_processor_boundary.py" \
            "$GITHUB_WORKSPACE/okto-pulse-core/tests/test_f11_telemetry_edition_boundary.py" \
            "$GITHUB_WORKSPACE/okto-pulse-core/tests/test_f12_thin_inbound_boundaries.py" \
            "$GITHUB_WORKSPACE/okto-pulse-core/tests/test_f15_persistence_edition_gate.py" \
            "$GITHUB_WORKSPACE/okto-pulse-core/tests/test_f16_saas_closure_report.py"

      - name: Verify Community wheel and closure report
        run: |
          python -m venv /tmp/f16-community
          /tmp/f16-community/bin/pip install /tmp/f16-dist/core/*.whl /tmp/f16-dist/community/*.whl
          /tmp/f16-community/bin/pip check
          cd /tmp
          /tmp/f16-community/bin/python - <<'PY'
          from pathlib import Path

          import okto_pulse.community
          from okto_pulse.community.main import app
          from okto_pulse.community.adapters.core_import_boundary import (
              audit_community_core_import_boundary,
          )

          paths = app.openapi().get("paths", {})
          assert len(paths) >= 240, len(paths)
          installed_root = Path(okto_pulse.community.__file__).resolve().parent
          boundary = audit_community_core_import_boundary(installed_root)
          assert boundary["ok"], boundary
          print(f"community-wheel-openapi-paths={len(paths)}")
          print(
              "community-wheel-core-boundary="
              f"{boundary['inventory_count']} imports, 0 violations"
          )
          PY
          /tmp/f16-community/bin/okto-pulse-saas-closure \
            --core-repo "$GITHUB_WORKSPACE/okto-pulse-core" \
            --community-repo "$GITHUB_WORKSPACE/okto-pulse" \
            --core-wheel /tmp/f16-dist/core/*.whl \
            --community-wheel /tmp/f16-dist/community/*.whl \
            --format text

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Build verify only — no GHCR push on PR/main.
      # Context is the workspace root because the Dockerfile uses sibling layout
      # (COPY okto-pulse-core/ and COPY okto-pulse/).
      # No pytest gate — see release.yml for rationale (smoke + MCP replay
      # on tag push is the behavioral gate).
      - name: Docker build (verify only, not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: okto-pulse/Dockerfile
          target: local-runtime
          push: false
          tags: okto-pulse:ci-${{ github.sha }}
