              - paragraph [ref=e1024]: "Refinamento do ensaio local autorizado; duas funções puras e quatro cenários determinísticos. Incluído para exercitar também a derivação intermediária do Pulse. ## Parent Ideation Context - Title: E2E mock — etiquetas e resumo de estoque (14/10) - Version: 6 ### Description Ensaio descartável para validar o SDLC do Pulse da ideação ao fechamento. Duas funções Python puras com dados sintéticos; não é um produto real. A interface e o MCP sob teste são os do Pulse. Criar duas tasks e dois cards de teste e observar métricas calculadas a partir de provas atuais, até 100% de implementação/verificação e estado Done. Não alterar policies para obter aprovação. ### Problem Statement Confirmar que a mesma iniciativa atravessa criação, revisão, refinamento, especificação, implementação, testes autenticados e encerramento, com rastreabilidade e percentuais coerentes na UI e no MCP. ### Proposed Approach Fixture greenfield em D:/Projetos/pulse-e2e-estoque-mock. H01 normalizar_rotulo(texto): strip e upper, vazio após strip gera ValueError('rotulo_obrigatorio'). H02 somar_quantidades(quantidades): soma de lista de inteiros não negativos, vazia retorna 0, negativo gera ValueError('quantidade_negativa'), sem alterar a entrada. Domínio de entrada: strings para H01 e listas de inteiros (sem bool) para H02; tipos diferentes ficam fora do mock. Dois ACs e dois testes isolados por função; Python padrão e unittest. Sem UI nova, persistência, rede, relógio ou aleatoriedade. Novo conhecimento deste ensaio, sem decisão arquitetural reaproveitada. KG: nenhum similar ou bug relevante; busca global encontrou apenas T04 do mock anterior (entity_97a2d5ffb6f3caaf784f8826), que serve como antecedente de ensaio, sem reutilizar suas provas. Resultados de execução só serão registrados após observação local. ### Scope Assessment - Domains: 1/5 - Ambiguity: 1/5 - Dependencies: 1/5 - Complexity: small"
