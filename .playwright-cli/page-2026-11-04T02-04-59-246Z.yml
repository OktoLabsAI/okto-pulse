                      - paragraph [ref=f6e649]: "Details mantém consulta de checkpoints, impacto, obrigações, recibos, resultados e histórico com identificação de origem, sem formulário de recibo para humano. Montar leitores somente quando seção aberta; paginação scoped card com limite <=20. Primeira abertura Delivery: uma leitura de projeção por card, zero leitura do ledger da Spec inteira/GET board por componente. Um coordenador compartilha snapshot e refresh; sem botão Refresh duplicado ou polling em aba inativa. Após mutação usar resumo confirmado da resposta; em generation pendente mostrar atualizando e uma reconsulta coalescida de até 1/s enquanto aba ativa, nunca estado verde antigo. Indisponibilidade possui retry explícito, não polling infinito. Conservar seleção, foco e rascunho ao recolher; não confundir vazio com indisponível."
