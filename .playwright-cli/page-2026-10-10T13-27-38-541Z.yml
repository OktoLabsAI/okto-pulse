                  - heading "Description" [level=4] [ref=f6e468]
                  - paragraph [ref=f6e470]: Quatro comportamentos locais para testar as barras de implementação e entrega verificada do Pulse. Dados sintéticos; sem produto real ou integrações. As obrigações efetivas (FR, BR e AC) serão enumeradas por Card antes da prova; os dois comportamentos por história não implicam duas obrigações no denominador. O percentual observado deve ser calculado sobre esse inventário, nunca escolhido pelo executor.
                - generic [ref=f6e471]:
                  - heading "Context" [level=4] [ref=f6e472]
                  - generic [ref=f6e473]:
                    - heading "Problem Statement" [level=2] [ref=f6e474]
                    - paragraph [ref=f6e475]: Diferenciar visualmente implementação comprovada e maturidade da entrega, reproduzindo percentuais a partir de obrigações e provas atuais em um mock controlado.
                    - heading "Proposed Approach" [level=2] [ref=f6e476]
                    - paragraph [ref=f6e477]: "Mock local e descartável em Python, sem servidor, banco, autenticação ou integrações. Quatro funções independentes exercitam as quatro histórias com itens sintéticos em memória: listar preservando ordem e lista vazia; adicionar nome válido após trim e rejeitar nome vazio; marcar/desmarcar purchased por id; filtrar pendentes e restaurar todos. Cada história terá uma task e critérios verificáveis por testes locais. A interface sob teste é a do Pulse (capa do Card e Delivery), não uma nova interface de compras. Percorrer o fluxo nativo até Spec e Cards; registrar implementação por prova de código e verificação por execução autenticada. O denominador será conferido no inventário efetivo antes de executar, para não confundir estimativa de duas obrigações por card com quantidade observada. Fora do escopo: produto real, infraestrutura e migração. A consulta obrigatória ao KG não encontrou decisões, conhecimento ou bugs anteriores neste Board novo."
                    - heading "Scope Assessment" [level=2] [ref=f6e478]
