                      - listitem [ref=f6e481]: "Ambiguity: 1/5"
                      - listitem [ref=f6e482]: "Dependencies: 1/5"
                      - listitem [ref=f6e483]: "Complexity: small"
                    - heading "Contrato do fixture (edição 1)" [level=2] [ref=f6e484]
                    - paragraph [ref=f6e485]: Greenfield em D:/Projetos/pulse-completude-mock. Nenhum código deste fixture foi inspecionado como existente ou entregue. Python 3.13, biblioteca padrão; operações recebem listas de dicts id:int positivo único, name:str não vazio, purchased:bool. O domínio de entrada é essa forma válida; validações extras de tipos/ids duplicados ficam fora do mock. Funções retornam novos dicts/listas e não alteram os argumentos. Sem filesystem, relógio, rede ou aleatoriedade nas funções. Cada teste cria sua própria lista.
                    - paragraph [ref=f6e486]: "Project Structure: applicable. Árvore TO-BE com shopping.py e test_shopping.py; não é evidência AS-IS. Não há contratos de rede, arquitetura distribuída, IR, OR ou decisões estratégicas adicionais. Bibliotecas externas não são necessárias. Testes negativos cobrem nome vazio e id inexistente. Evidências de implementação e relatórios autenticados de testes serão produzidos apenas após execução."
