      - generic [ref=f5e821]:
        - heading "Delivery status — See what has been delivered" [level=2] [ref=f5e822]
        - paragraph [ref=f5e823]:
          - text: Open a Spec's
          - strong [ref=f5e824]: Coverage → Implementation
          - text: "view to see its delivery status. The main screen answers three questions: what was delivered, what is in progress and what is pending."
        - heading "A task's Delivery tab" [level=3] [ref=f5e825]
        - paragraph [ref=f5e826]:
          - text: The task has one current verdict, a short reason, its latest update and at most one primary next action.
          - strong [ref=f5e827]: Details
          - text: starts closed. A check icon accompanies
          - strong [ref=f5e828]: Delivered
          - text: ; an X accompanies
          - strong [ref=f5e829]: Verification failed
          - text: . The text conveys the same result without relying on color or the icon.
        - table [ref=f5e830]:
          - rowgroup [ref=f5e831]:
            - row [ref=f5e832]:
              - columnheader "Task status" [ref=f5e833]
              - columnheader "Meaning" [ref=f5e834]
          - rowgroup [ref=f5e835]:
            - row [ref=f5e836]:
              - cell [ref=f5e837]:
                - strong [ref=f5e838]: Checking delivery / Delivery unavailable
              - cell "The current result is not confirmed. Wait for preparation or explicitly retry a failed read." [ref=f5e839]
            - row [ref=f5e840]:
              - cell [ref=f5e841]:
                - strong [ref=f5e842]: Not required
              - cell "An authorized decision made the task optional or waived for this edition. It does not mean delivered." [ref=f5e843]
            - row [ref=f5e844]:
              - cell [ref=f5e845]:
                - strong [ref=f5e846]: Verification failed
              - cell "Current verification contains a failure that needs attention." [ref=f5e847]
            - row [ref=f5e848]:
              - cell [ref=f5e849]:
                - strong [ref=f5e850]: Previously completed
              - cell "Historical Done is preserved, but current proof no longer confirms delivery." [ref=f5e851]
            - row [ref=f5e852]:
              - cell [ref=f5e853]:
                - strong [ref=f5e854]: Work remaining
              - cell "Implementation remains pending. The reason distinguishes not started, paused and cancelled work." [ref=f5e855]
            - row [ref=f5e856]:
              - cell [ref=f5e857]:
                - strong [ref=f5e858]: Awaiting verification
              - cell "Implementation is present; required verification remains pending." [ref=f5e859]
            - row [ref=f5e860]:
              - cell [ref=f5e861]:
                - strong [ref=f5e862]: Awaiting completion
              - 'cell "Evidence alone is insufficient: a report, review or other completion check remains." [ref=f5e863]'
            - row [ref=f5e864]:
              - cell [ref=f5e865]:
                - strong [ref=f5e866]: Delivered
              - cell "Current required proof and completion are confirmed." [ref=f5e867]
            - row [ref=f5e868]:
              - cell [ref=f5e869]:
                - strong [ref=f5e870]: Ready to complete
              - cell "The current checks permit the next completion action; it has not yet been performed." [ref=f5e871]
        - paragraph [ref=f5e872]:
          - text: A human update has its audit receipt generated automatically. This proves who submitted the text and when; it does not prove code execution, passing tests or approval. See
          - strong [ref=f5e873]: Task progress
          - text: for submission, retry and correction rules. There is no manual receipt form, including in Details.
        - paragraph [ref=f5e874]:
          - strong [ref=f5e875]: Details
          - text: provides read-only verification, pending work, evidence history and test navigation. A human may also change whether the task is required. Pages contain at most 20 records; use the next-page controls when needed. Details and its subsections load only when requested.
          - strong [ref=f5e876]: Refresh
          - text: updates the shared task assessment; pending generation checks are grouped and stop when the tab is inactive. Network errors require an explicit retry, and refreshing preserves an open draft.
        - paragraph [ref=f5e877]:
          - text: Use Tab to reach
          - strong [ref=f5e878]: Details
          - text: ","
          - strong [ref=f5e879]: Refresh
          - text: or
          - strong [ref=f5e880]: How this works
          - text: ", then Enter or Space to activate them. The help link opens this exact topic. Each form has named fields and errors; success and failure include visible text."
        - heading "Read the groups" [level=3] [ref=f5e881]
        - table [ref=f5e882]:
          - rowgroup [ref=f5e883]:
            - row [ref=f5e884]:
              - columnheader "Group" [ref=f5e885]
              - columnheader "Meaning" [ref=f5e886]
              - columnheader "Next step" [ref=f5e887]
          - rowgroup [ref=f5e888]:
            - row [ref=f5e889]:
              - cell [ref=f5e890]:
                - strong [ref=f5e891]: Delivered
              - cell "A required task is Done and its current delivery checks and proof are satisfied." [ref=f5e892]
              - cell [ref=f5e893]:
                - text: Open
                - strong [ref=f5e894]: Details
                - text: if you need to inspect the evidence.
            - row [ref=f5e895]:
              - cell [ref=f5e896]:
                - strong [ref=f5e897]: In progress
              - cell "Work on the task is currently in progress." [ref=f5e898]
              - cell "Follow its progress or open the task to continue the work." [ref=f5e899]
            - row [ref=f5e900]:
              - cell [ref=f5e901]:
                - strong [ref=f5e902]: Pending
              - cell "The task still needs work, validation, a dependency or confirmation of its current proof." [ref=f5e903]
              - cell "Read the short reason beside the task and address that step." [ref=f5e904]
            - row [ref=f5e905]:
              - cell [ref=f5e906]:
                - strong [ref=f5e907]: Optional / Waived
              - cell "A human decision makes this task unnecessary for delivery in this Spec edition." [ref=f5e908]
              - cell "Expand the section to review it or change its requirement. It does not count as delivered work." [ref=f5e909]
        - paragraph [ref=f5e910]:
          - strong [ref=f5e911]: Awaiting validation
          - text: stays Pending. Finishing the work and approving its delivery are separate steps. A task in
          - strong [ref=f5e912]: Done
          - text: can also appear as
          - strong [ref=f5e913]: Completion awaiting confirmation
          - text: when its proof is missing or out of date. Its historical Done status is preserved; the delivery screen does not reopen it automatically.
        - paragraph [ref=f5e914]:
          - strong [ref=f5e915]: Waiting for a dependency
          - text: means another task must be resolved first. Open the task to inspect that dependency. On-hold, rejected and cancelled tasks retain a short reason in Pending while they are required.
        - heading "Examples" [level=3] [ref=f5e916]
        - list [ref=f5e917]:
          - listitem [ref=f5e918]:
            - text: A task with complete implementation proof that is still awaiting validation remains
            - strong [ref=f5e919]: Pending
            - text: .
          - listitem [ref=f5e920]:
            - text: A Done task whose proof is current appears in
            - strong [ref=f5e921]: Delivered
            - text: . If that proof becomes stale, confirmation is pending again.
          - listitem [ref=f5e922]:
            - text: A waived task appears in
            - strong [ref=f5e923]: Optional / Waived
            - text: ", even if its work status says Done or In progress."
          - listitem [ref=f5e924]:
            - text: Two tasks can share one requirement. The main counts are
            - strong [ref=f5e925]: task counts
            - text: ; one task's completion does not automatically deliver the other.
        - heading "Change what is required" [level=3] [ref=f5e926]
        - paragraph [ref=f5e927]:
          - text: Use
          - strong [ref=f5e928]: Change requirement
          - text: beside a task, or
          - strong [ref=f5e929]: Change task requirements
          - text: to select up to 50 tasks. Use
          - strong [ref=f5e930]: Load more
          - text: to find further tasks, then continue with the selection. Choose
          - strong [ref=f5e931]: Required
          - text: ","
          - strong [ref=f5e932]: Optional
          - text: or
          - strong [ref=f5e933]: Waived
          - text: ", add a"
          - strong [ref=f5e934]: note if useful
          - text: ", and save once. Only an authorized human can make this decision. Read-only users can inspect the requirement and its history."
        - paragraph [ref=f5e935]:
          - text: Saving changes the selected tasks' requirement for the
          - strong [ref=f5e936]: current Spec edition
          - text: . It does not mark tasks Done, create proof, remove other tasks' responsibilities or satisfy the Spec's required test scenarios. The whole selection is saved together. Restoring
          - strong [ref=f5e937]: Required
          - text: adds a new recorded decision; it does not erase history or reactivate revoked proof. The
          - strong [ref=f5e938]: Task requirements
          - text: Help topic explains these choices in full.
        - paragraph [ref=f5e939]:
          - text: If a conflict occurs, review the latest requirements. Your note and choice are preserved. If the save response is uncertain, use
          - strong [ref=f5e940]: Retry same decision
          - text: before making another change. An accepted save confirms the decision; it does not approve delivery.
        - heading "Updating, unavailable and empty" [level=3] [ref=f5e941]
        - paragraph [ref=f5e942]:
          - text: While status is
          - strong [ref=f5e943]: updating
          - text: or
          - strong [ref=f5e944]: being prepared
          - text: ", completion and counts may not yet be confirmed. Unknown counts are not zero. The screen makes a few automatic refresh attempts; use"
          - strong [ref=f5e945]: Refresh delivery status
          - text: to check again. An access error or unavailable calculation is not an empty Spec. Review your access with the Board owner, or refresh after the service recovers.
          - strong [ref=f5e946]: No tasks in this Spec
          - text: appears only when the complete current task list is known to be empty.
        - heading "Details and traceability" [level=3] [ref=f5e947]
        - paragraph [ref=f5e948]:
          - strong [ref=f5e949]: Details
          - text: opens the existing implementation, verification, coverage and evidence views. Additional task pages and detailed evidence load when requested. Reopening Details preserves its local draft. The simplified screen keeps the same history, permissions and delivery rules. Viewing it does not approve a Spec or a task. Progress is reported when work changes meaningfully; the
          - strong [ref=f5e950]: Task progress
          - text: Help topic explains that policy. Agent instructions complement these guides. The application Help and the link beside this screen remain the user-facing rules.
