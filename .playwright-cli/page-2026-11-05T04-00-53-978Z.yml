      - generic [ref=f1e5442]:
        - heading "Delivery status — See what has been delivered" [level=2] [ref=f1e5443]
        - paragraph [ref=f1e5444]:
          - text: Open a Spec's
          - strong [ref=f1e5445]: Coverage → Implementation
          - text: "view to see its delivery status. The main screen answers three questions: what was delivered, what is in progress and what is pending."
        - heading "A task's Delivery tab" [level=3] [ref=f1e5446]
        - paragraph [ref=f1e5447]:
          - text: "The main view shows, in order: the current delivery status,"
          - strong [ref=f1e5448]: Implementation
          - text: and
          - strong [ref=f1e5449]: Verification
          - text: percentages, the
          - strong [ref=f1e5450]: Requirement / Objective
          - text: matrix when applicable, and the
          - strong [ref=f1e5451]: Show details
          - text: /
          - strong [ref=f1e5452]: Hide details
          - text: and
          - strong [ref=f1e5453]: Change task requirements
          - text: buttons. Details starts closed. A check icon accompanies
          - strong [ref=f1e5454]: Delivered
          - text: ; an X accompanies
          - strong [ref=f1e5455]: Verification failed
          - text: . The text conveys the same result without relying on color or the icon.
        - paragraph [ref=f1e5456]:
          - text: Each matrix row is an item assigned to this task, with independent implementation and verification results. The percentages come from the current assessment of this task, not from its workflow status or from the visible page alone.
          - strong [ref=f1e5457]: 100%
          - text: proof does not complete the task or replace the delivery verdict.
          - strong [ref=f1e5458]: Unknown
          - text: and
          - strong [ref=f1e5459]: Not applicable
          - text: are not zero.
          - strong [ref=f1e5460]: Waived
          - text: and
          - strong [ref=f1e5461]: Not applicable
          - text: do not create passing proof. Test Cards show their assigned test scenarios; implementation can be
          - strong [ref=f1e5462]: Not applicable
          - text: . A task without applicable assigned items has no matrix. Use
          - strong [ref=f1e5463]: Next items
          - text: or
          - strong [ref=f1e5464]: First items
          - text: when the matrix spans more than one page.
        - paragraph [ref=f1e5465]:
          - text: Use
          - strong [ref=f1e5466]: Change task requirements
          - text: to choose Required, Optional or Waived for this task; a note is optional. The button is next to Details and does not require opening the technical information. Users without edit authority see
          - strong [ref=f1e5467]: View task requirements
          - text: . Progress forms, latest updates, history, receipts and technical diagnosis are inside Details.
        - table [ref=f1e5468]:
          - rowgroup [ref=f1e5469]:
            - row [ref=f1e5470]:
              - columnheader "Task status" [ref=f1e5471]
              - columnheader "Meaning" [ref=f1e5472]
          - rowgroup [ref=f1e5473]:
            - row [ref=f1e5474]:
              - cell [ref=f1e5475]:
                - strong [ref=f1e5476]: Checking delivery
              - cell "A current assessment is being requested or prepared. Wait for the result." [ref=f1e5477]
            - row [ref=f1e5478]:
              - cell [ref=f1e5479]:
                - strong [ref=f1e5480]: Needs attention
              - cell "The assessment found unclear requirement responsibility. Open Details to review the affected items and next steps." [ref=f1e5481]
            - row [ref=f1e5482]:
              - cell [ref=f1e5483]:
                - strong [ref=f1e5484]: Delivery not confirmed
              - cell "The assessment returned insufficient information. Read the reason and resolve the missing information; this is not an active loading state." [ref=f1e5485]
            - row [ref=f1e5486]:
              - cell [ref=f1e5487]:
                - strong [ref=f1e5488]: Delivery unavailable
              - cell "The current result could not be read. Use Refresh card to retry." [ref=f1e5489]
            - row [ref=f1e5490]:
              - cell [ref=f1e5491]:
                - strong [ref=f1e5492]: Not required
              - cell "An authorized decision made the task optional or waived for this edition. It does not mean delivered." [ref=f1e5493]
            - row [ref=f1e5494]:
              - cell [ref=f1e5495]:
                - strong [ref=f1e5496]: Verification failed
              - cell "Current verification contains a failure that needs attention." [ref=f1e5497]
            - row [ref=f1e5498]:
              - cell [ref=f1e5499]:
                - strong [ref=f1e5500]: Previously completed
              - cell "Historical Done is preserved, but current proof no longer confirms delivery." [ref=f1e5501]
            - row [ref=f1e5502]:
              - cell [ref=f1e5503]:
                - strong [ref=f1e5504]: Work remaining
              - cell "Implementation remains pending. The reason distinguishes not started, paused and cancelled work." [ref=f1e5505]
            - row [ref=f1e5506]:
              - cell [ref=f1e5507]:
                - strong [ref=f1e5508]: Awaiting verification
              - cell "Implementation is present; required verification remains pending." [ref=f1e5509]
            - row [ref=f1e5510]:
              - cell [ref=f1e5511]:
                - strong [ref=f1e5512]: Awaiting completion
              - 'cell "Evidence alone is insufficient: a report, review or other completion check remains." [ref=f1e5513]'
            - row [ref=f1e5514]:
              - cell [ref=f1e5515]:
                - strong [ref=f1e5516]: Delivered
              - cell "Current required proof and completion are confirmed." [ref=f1e5517]
            - row [ref=f1e5518]:
              - cell [ref=f1e5519]:
                - strong [ref=f1e5520]: Ready to complete
              - cell "The current checks permit the next completion action; it has not yet been performed." [ref=f1e5521]
        - paragraph [ref=f1e5522]:
          - text: A human update has its audit receipt generated automatically. This proves who submitted the text and when; it does not prove code execution, passing tests or approval. See
          - strong [ref=f1e5523]: Task progress
          - text: for submission, retry and correction rules. There is no manual receipt form, including in Details.
        - paragraph [ref=f1e5524]:
          - strong [ref=f1e5525]: Last recorded update
          - text: includes its submission time.
          - strong [ref=f1e5526]: Work remaining when this update was recorded
          - text: preserves what the author reported then. These historical declarations can describe work that is now complete; use the current status and matrix to see what remains today.
        - paragraph [ref=f1e5527]:
          - strong [ref=f1e5528]: Show details
          - text: opens
          - strong [ref=f1e5529]: Pending work and verification
          - text: directly, followed by progress and delivery forms, evidence history and test navigation. There is no second button to reveal the checks.
        - paragraph [ref=f1e5530]:
          - text: The pending-work table names the
          - strong [ref=f1e5531]: Requirement / Objective
          - text: ", its"
          - strong [ref=f1e5532]: Affected stage
          - text: ","
          - strong [ref=f1e5533]: What needs attention
          - text: and the
          - strong [ref=f1e5534]: Next step
          - text: . A test scenario can be waiting for another task's implementation; its row names the related requirements and explains that they are prerequisites for verification. General completion checks appear separately under
          - strong [ref=f1e5535]: Task-wide and unassigned checks
          - text: . When a requirement cannot be identified, the table says so instead of assigning the problem to an unrelated item. A check can affect several requirements, and one requirement can have several independent checks.
        - paragraph [ref=f1e5536]:
          - text: Open
          - strong [ref=f1e5537]: Evidence and technical details
          - text: on an occurrence when you need its original assessment, references or full action plan. These details are optional; the responsible agent handles technical evidence and receipts. The table does not ask a human to supply a receipt. An assessment with no listed checks does not itself approve delivery; the status above remains authoritative.
        - paragraph [ref=f1e5538]:
          - text: Pages contain at most 20 checks; use
          - strong [ref=f1e5539]: Next checks
          - text: or
          - strong [ref=f1e5540]: First checks
          - text: when needed. Partial lists of impacted items are explicitly identified. Opening Details loads one page; closing and reopening the same current assessment reuses that page. Full technical evidence loads only when requested. Use
          - strong [ref=f1e5541]: Refresh card
          - text: in the task modal header to update the status, percentages, matrix and open checks together; paginated views return to their first page. There is no separate refresh control in the Delivery overview. Pending generation checks are grouped and stop when the tab is inactive. After a network error, use the same header control,
          - strong [ref=f1e5542]: Retry delivery assessment
          - text: ", or"
          - strong [ref=f1e5543]: Retry delivery checks
          - text: as indicated; failed checks do not repeatedly reload in the background. Refreshing preserves an open draft and whether Details is expanded; submission is disabled until the assessment is current again.
        - paragraph [ref=f1e5544]:
          - text: Use Tab to reach
          - strong [ref=f1e5545]: Show details
          - text: /
          - strong [ref=f1e5546]: Hide details
          - text: ","
          - strong [ref=f1e5547]: Refresh card
          - text: or
          - strong [ref=f1e5548]: How this works
          - text: ", then Enter or Space to activate them. The help link opens this exact topic. Each form has named fields and errors; success and failure include visible text."
        - heading "Read the groups" [level=3] [ref=f1e5549]
        - table [ref=f1e5550]:
          - rowgroup [ref=f1e5551]:
            - row [ref=f1e5552]:
              - columnheader "Group" [ref=f1e5553]
              - columnheader "Meaning" [ref=f1e5554]
              - columnheader "Next step" [ref=f1e5555]
          - rowgroup [ref=f1e5556]:
            - row [ref=f1e5557]:
              - cell [ref=f1e5558]:
                - strong [ref=f1e5559]: Delivered
              - cell "A required task is Done and its current delivery checks and proof are satisfied." [ref=f1e5560]
              - cell [ref=f1e5561]:
                - text: Open
                - strong [ref=f1e5562]: Details
                - text: if you need to inspect the evidence.
            - row [ref=f1e5563]:
              - cell [ref=f1e5564]:
                - strong [ref=f1e5565]: In progress
              - cell "Work on the task is currently in progress." [ref=f1e5566]
              - cell "Follow its progress or open the task to continue the work." [ref=f1e5567]
            - row [ref=f1e5568]:
              - cell [ref=f1e5569]:
                - strong [ref=f1e5570]: Pending
              - cell "The task still needs work, validation, a dependency or confirmation of its current proof." [ref=f1e5571]
              - cell "Read the short reason beside the task and address that step." [ref=f1e5572]
            - row [ref=f1e5573]:
              - cell [ref=f1e5574]:
                - strong [ref=f1e5575]: Optional / Waived
              - cell "A human decision makes this task unnecessary for delivery in this Spec edition." [ref=f1e5576]
              - cell "Expand the section to review it or change its requirement. It does not count as delivered work." [ref=f1e5577]
        - paragraph [ref=f1e5578]:
          - strong [ref=f1e5579]: Awaiting validation
          - text: stays Pending. Finishing the work and approving its delivery are separate steps. A task in
          - strong [ref=f1e5580]: Done
          - text: can also appear as
          - strong [ref=f1e5581]: Completion awaiting confirmation
          - text: when its proof is missing or out of date. Its historical Done status is preserved; the delivery screen does not reopen it automatically.
        - paragraph [ref=f1e5582]:
          - strong [ref=f1e5583]: Waiting for a dependency
          - text: means another task must be resolved first. Open the task to inspect that dependency. On-hold, rejected and cancelled tasks retain a short reason in Pending while they are required.
        - heading "Examples" [level=3] [ref=f1e5584]
        - list [ref=f1e5585]:
          - listitem [ref=f1e5586]:
            - text: A task with complete implementation proof that is still awaiting validation remains
            - strong [ref=f1e5587]: Pending
            - text: .
          - listitem [ref=f1e5588]:
            - text: A Done task whose proof is current appears in
            - strong [ref=f1e5589]: Delivered
            - text: . If that proof becomes stale, confirmation is pending again.
          - listitem [ref=f1e5590]:
            - text: A waived task appears in
            - strong [ref=f1e5591]: Optional / Waived
            - text: ", even if its work status says Done or In progress."
          - listitem [ref=f1e5592]:
            - text: Two tasks can share one requirement. The main counts are
            - strong [ref=f1e5593]: task counts
            - text: ; one task's completion does not automatically deliver the other.
        - heading "Change what is required" [level=3] [ref=f1e5594]
        - paragraph [ref=f1e5595]:
          - text: Use
          - strong [ref=f1e5596]: Change requirement
          - text: beside a task, or
          - strong [ref=f1e5597]: Change task requirements
          - text: to select up to 50 tasks. Use
          - strong [ref=f1e5598]: Load more
          - text: to find further tasks, then continue with the selection. Choose
          - strong [ref=f1e5599]: Required
          - text: ","
          - strong [ref=f1e5600]: Optional
          - text: or
          - strong [ref=f1e5601]: Waived
          - text: ", add a"
          - strong [ref=f1e5602]: note if useful
          - text: ", and save once. Only an authorized human can make this decision. Read-only users can inspect the requirement and its history."
        - paragraph [ref=f1e5603]:
          - text: Saving changes the selected tasks' requirement for the
          - strong [ref=f1e5604]: current Spec edition
          - text: . It does not mark tasks Done, create proof, remove other tasks' responsibilities or satisfy the Spec's required test scenarios. The whole selection is saved together. Restoring
          - strong [ref=f1e5605]: Required
          - text: adds a new recorded decision; it does not erase history or reactivate revoked proof. The
          - strong [ref=f1e5606]: Task requirements
          - text: Help topic explains these choices in full.
        - paragraph [ref=f1e5607]:
          - text: If a conflict occurs, review the latest requirements. Your note and choice are preserved. If the save response is uncertain, use
          - strong [ref=f1e5608]: Retry same decision
          - text: before making another change. An accepted save confirms the decision; it does not approve delivery.
        - heading "Updating, unavailable and empty" [level=3] [ref=f1e5609]
        - paragraph [ref=f1e5610]:
          - text: While status is
          - strong [ref=f1e5611]: updating
          - text: or
          - strong [ref=f1e5612]: being prepared
          - text: ", completion and counts may not yet be confirmed. Unknown counts are not zero. The screen makes a few automatic refresh attempts; use"
          - strong [ref=f1e5613]: Refresh delivery status
          - text: to check again. An access error or unavailable calculation is not an empty Spec. Review your access with the Board owner, or refresh after the service recovers.
          - strong [ref=f1e5614]: No tasks in this Spec
          - text: appears only when the complete current task list is known to be empty.
        - heading "Details and traceability" [level=3] [ref=f1e5615]
        - paragraph [ref=f1e5616]:
          - strong [ref=f1e5617]: Details
          - text: opens the existing implementation, verification, coverage and evidence views. Additional task pages and detailed evidence load when requested. Reopening Details preserves its local draft. The simplified screen keeps the same history, permissions and delivery rules. Viewing it does not approve a Spec or a task. Progress is reported when work changes meaningfully; the
          - strong [ref=f1e5618]: Task progress
          - text: Help topic explains that policy. Agent instructions complement these guides. The application Help and the link beside this screen remain the user-facing rules.
