                    - generic [ref=f10e2617]:
                      - text: Technical
                      - paragraph [ref=f10e2618]: Identidade vem da sessão validada, nunca owner_id do cliente. Revalidar autorização inclusive em replay; sem sessão=401, alheio/inexistente=404; CSRF inválido não muta. HTTPS exige cookie Secure/HttpOnly/SameSite; não expor cookies, senhas, SQL ou stacktrace. · tr_res_security
