                      - generic [ref=f10e2626]: technical
                    - paragraph [ref=f10e2627]: Com Clock controlado, comando bloqueado pela transação usa now obtido após aquisição; UTC e fuso local produzem os mesmos limites, sem relógio global no domínio.
