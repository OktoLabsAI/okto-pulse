                    - generic [ref=f10e2632]:
                      - text: Technical
                      - paragraph [ref=f10e2633]: Persistir instantes UTC e aplicar calendário America/Sao_Paulo. Clock público substituível; capturar now após adquirir transação. Recusar offsets incoerentes e horários ambíguos/inexistentes, sem inferência silenciosa. · tr_res_clock
