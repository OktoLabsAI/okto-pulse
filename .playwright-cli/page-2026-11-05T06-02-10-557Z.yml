                  - paragraph [ref=f2e3605]: "Focused brownfield remediation research for the completed 0.4.3 E2E audit. This draft is not approved for implementation. Complete code Evidence, research decisions, architecture/visual details and precise acceptance before saturation and derivation. All four remediation Specs must be ready before development starts. ## Parent Ideation Context - Title: 0.4.3 operational consistency — resolve the My Board E2E audit findings - Version: 33 ### Description Remediation intake authorized by the user after the My Board operational audit on 2026-11-04. Preserve the completed simplification work and trace every finding through investigation, decisions, Refinements, Specs, ordered implementation tasks and independent Test Cards. Specification of the complete scope must finish before production implementation starts. Evidence: output/playwright/e2e-operational-043-20261104/findings.json, audit-results.json, coverage-final.json and final-proof-and-regression.json. My Board audit Spec 1bd8d124-9f06-5c3c-882d-feccd6ed22a9; Normal task 7ff2f2a5-d459-5f9e-a667-04599057883d. Initial baselines: Core bf5c7e9b8896c4b388dc3c1d894169299637063e, Community 68ad3d6dd8d66a09b356b448c633a1e2d8c4f02c, both feature/v0.4.3. Scope inventory: E2E-001 Story invalid conversion UI; 002 contradictory assessment/resource contracts; 003 hidden recommended Q&A choices; 004 pending-Q&A lifecycle policy; 006 Target links to native scenarios; 007 non-serializable MCP validation errors; 008 transient authenticated receipt-ledger scan; 009 post-completion Bug changes normative responsibility and degrades delivery; 010 KG health and delivery failures; 011 outdated/flaky UI regressions; 012 omitted Bug regression candidate discovery; 013 validation response/persisted version disagreement; 014 cognitive commit contention and retryability disagreement. Investigate the additional Refinement investigation-outcome display observation (E2E-005, not yet confirmed). Prior art: existing completed Specs 65a786f1-3c8b-5bce-968e-e0c2ba6ca24e (human Delivery), 13e9c345-efec-5bae-9d60-80caf576060e (readiness), a98082d2-504f-51d3-bab0-510bb0353a48 (agent protocol). Do not reopen or silently change their frozen scope. KG Stage 1: health graph_state=at_risk, discovery_state=healthy; triad completed. No similar Decisions or Bug Learnings. Global discovery found entity_d83955fa55bc30b1bb6146b2 (delivery matrix), entity_83646a3f5c621a0fefc04b5b (worker snapshot/publish), criterion_5ee79d5e718f249f666f8f62 (worker concurrency tests), requirement_b6dd9ecb980e0d83fcb96dae (SQLite worker protocol). These are contextual hits, not new decision authority. Health also reports 1 consolidation dead letter and 87 global outbox dead letters on this board; investigate without manually editing graph/ledgers or bypassing gates. User delegates investigation, recommended decision selection, saturation and approval. Q&A answers must identify themselves as delegated agent decisions and retain explicit recommended options. English-only product copy and authored remediation artifacts. Human submissions keep automatic application receipts; humans never supply technical receipts. No weakening of evidence, authorization, traceability or native completion gates. ## Agreed outcome and non-negotiable invariants Operational consistency means a command's persisted result, its response, all native gates, the Delivery summary/matrix, and downstream lineage agree for the same authorized artifact revision. A completed delivery must not lose responsibility coverage merely because a related Bug is created. An actual new scope change may invalidate evidence only through an explicit governed change. The latest user direction is authoritative: Delivery shows status; separate implementation/verification percentages; the assigned requirement/objective matrix when applicable; Show details/Hide details and Change task requirements. Pending work is tabular: Requirement | Impacted phase | What needs attention | Next action. Preserve green check/red X Spec validation, the task modal refresh, automatic application receipts for human submissions, optional note for Required/Optional/Waived, English product copy, central Help and help at the point of use. Never revive the earlier status-only design or require technical receipts from humans. ## Four bounded workstreams and ownership R1 — Lifecycle and normative responsibility integrity: E2E-004, E2E-009, E2E-012, E2E-013. Own actor-independent pending-Q&A gates, immutable origin responsibility, native regression candidate discovery, accurate persisted validation version/CAS/replay, and a conservative auditable repair of proven inherited links. R2 — Source/evidence and agent contract reliability: E2E-002, E2E-005, E2E-006, E2E-007, E2E-008. Own contextual investigation provenance across finalization, correct native scenario membership for Targets, JSON-safe bounded errors, stable authenticated ledger observation, and exact resource/tool examples without extra orchestration. R3 — KG concurrency and durable operational health: E2E-010 and E2E-014, including the transient SQLite write contention reproduced while answering this initiative's Q&A. Own writer lifecycle, short relational transactions, bounded conflict handling, cancellation/release, retryability parity and durable debt diagnostics/reconciliation. Investigate the actual lock owner and configuration errors before prescribing a fix. R4 — Human-facing clarity and regression coverage: E2E-001, E2E-003, E2E-011 and the Delivery display portion of E2E-009/E2E-005. Own valid Story status actions, truthful saved status, visible recommended choices and tradeoffs, actionable settled scope-gap text, current-vs-historical source context, component regression updates/stability, English Help and live installed-UI acceptance. ## Investigation evidence and confidence Confirmed source causes: Core CardService._inherit_bug_origin_traceability directly appends the new Bug to business_rules, technical_requirements and other Spec collections (main.py:3737-3793), although the implementation plan remains unchanged. This is a command-side normative write, not an inferred graph-projection cause. Code Traceability _require_spec_entity looks up test_scenario_ids on Spec rather than its native scenario collection and assumes status=active for all child families. MCP regression preview normalizes an omitted candidate list through validate_string_list; its domain resolver distinguishes omission from an explicit set. Validation response promises expected_subject_version+1 before the shared resequencer; persisted-version behavior requires adapter-level proof. StoryModal renders the complete STORY_STATUSES catalog in a manual selector and shares draft selection state with its status presentation. Confirmed runtime discrepancy: finalized audit Refinement 950d51d8-93fc-43c8-a003-da4bd9d58e61 has version 6 and reports investigation_outcome=null, although its approved version-5 investigation and derived Spec preserve the legitimate no_relevant_existing_implementation result. Treat this as E2E-005 and distinguish frozen source context from a fresh execution attestation. Still to resolve in Refinement research: exact KG long-held writer/configuration failure, stable receipt-scan race source, and the UI test timeout mechanism. Their symptoms are confirmed; their root causes are not asserted yet. The initial Q&A write failed atomically with SQLite lock contention; a fresh read showed no partial answer and a later single retry succeeded. This is evidence of an operational failure, not permission to weaken transaction integrity. ## Acceptance and verification boundary Every E2E-001 through E2E-014 finding must map to a requirement, implementation task and negative/positive regression test or a source-backed non-defect disposition. E2E-005 is newly confirmed as a read/provenance discrepancy; no numbered gap may disappear. Test actual persistence and newly opened sessions, not just mocked responses. Verify MCP and REST parity, agent/human authorization, duplicate/reordered requests, version conflicts, rollback, cross-board/cross-Spec rejection, cancellation, receipt tampering, and concurrent graph/relational writers as applicable. After all four Specs are saturated and ready, execute ordered Normal tasks and separate Test Cards. Build/install the paired 0.4.3 packages on existing feature/v0.4.3 branches, restart the verified runtime without altering data, then verify My Board and screenshots. Retain the initial failed audit history and cancelled probes; append correction proof. KG closeout must commit and be queryable or remain explicitly unresolved; green unit suites alone do not close the initiative. ## Research deliverables and precedence The ideation now includes Architecture Design bf9bf04d-f119-40bb-8d61-0acf8a42768f and Mockup sm_9c3ecd01 as concrete ownership and visual acceptance baselines. The focused Refinements extend these with source-backed details. R1 specifies association/authority and validation state transitions; R2 specifies evidence receipt/transport boundaries; R3 specifies lock and transaction lifecycle; R4 includes screen states for Story, Q&A, Delivery and source-context interpretation. Board design-system preflight: none configured, mandate=false; reuse existing application components and English style. Specify all four streams before modifying production code. Implementation order: shared domain/transaction contracts and graph runtime prerequisites, adapter changes, human UI/help/resources, then integration/installed E2E and cognitive closeout. Cross-Spec dependencies must be explicit and acyclic. No new product feature, gate bypass, direct database/graph repair, retrospective fabricated evidence, replacement of storage backend, or destructive queue clearing is in scope. Repairs must be narrowly proven and auditable; ambiguous legacy links remain visible for explicit review. ### Problem Statement The 0.4.3 E2E audit found contradictions across persisted lifecycle, normative responsibility, evidence/transport contracts, KG processing and human UI. These produce retroactive delivery degradation, misleading status, failed evidence operations, unresolved clarifications and unreliable closeout despite passing isolated tests. ### Proposed Approach Deliver four traceable remediation Specs from focused brownfield Refinements: lifecycle/responsibility; source/evidence/agent contracts; KG concurrency and durable health; human UI/help and regression coverage. Resolve every audit finding with source-backed research, explicit recommended decisions, architecture/mockups and negative/positive scenarios before development. Preserve the approved Delivery matrix layout and all traceability/authority gates; verify the installed paired 0.4.3 release in My Board. ### Scope Assessment - Domains: 3/5 - Ambiguity: 1/5 - Dependencies: 3/5 - Complexity: large ### Q&A Decisions **Q:** How should corrections be organized while preserving the existing 0.4.3 simplification work? **A:** Delegated agent decision under the user's explicit authorization to saturate, approve, derive, implement and test autonomously. Recommended option selected: One remediation initiative with four bounded Refinements and Specs. Rationale: Groups lifecycle/responsibility, evidence/contracts, KG concurrency, and human UI; one coverage matrix prevents orphan findings. This records Codex's decision; it does not impersonate a human approval or grant a human-only waiver. **Q:** What authority should a Bug created from a completed task have over the originating Spec? **A:** Delegated agent decision under the user's explicit autonomous authorization. Recommended option selected: Preserve approved responsibilities; record Bug lineage separately. Rationale: Origin and regression links remain traceable without changing normative allocation, percentages, or frozen scope. Codex is the recorded actor; no human-only authority is assumed. **Q:** How should pending Q&A affect a planning artifact's closeout? **A:** Delegated agent decision under the user's explicit autonomous authorization. Recommended option selected: Require resolution for both humans and agents. Rationale: An open clarification cannot disappear at derivation; unresolved items must be answered or explicitly disposed through an auditable supported action before freezing. Codex is the recorded actor; no human-only authority is assumed. **Q:** Which Delivery layout is the acceptance baseline for remediation? **A:** Delegated agent decision under the user's explicit autonomous authorization. Recommended option selected: Keep status, implementation/verification percentages, requirement matrix, and Details buttons. Rationale: Matches the latest explicit user direction; clarify failures per requirement and reserve loading text for actual computation. Codex is the recorded actor; no human-only authority is assumed. **Q:** How should authenticated evidence behave when a receipt directory changes during a scan? **A:** Delegated agent decision under the user's explicit autonomous authorization. Recommended option selected: Bounded re-observation of legitimate concurrent publication with integrity checks intact. Rationale: Avoid unnecessary agent resubmission while continuing to reject tampering, invalid files, symlinks, incomplete receipts, and exhausted retries. Codex is the recorded actor; no human-only authority is assumed. **Q:** How should KG contention and unhealthy delivery be addressed? **A:** Delegated agent decision under the user's explicit autonomous authorization. Recommended option selected: Fix writer ownership and bounded retry; preserve failed records and truthful health. Rationale: Find the actual blocking path, prevent starvation, reconcile only through authorized durable processing, and verify commit plus queries. Codex is the recorded actor; no human-only authority is assumed. **Q:** What should happen to already affected audit data? **A:** Delegated agent decision under the user's explicit autonomous authorization. Recommended option selected: Use a narrowly scoped auditable repair with preview, authority fences, and idempotence. Rationale: Repair only links proven to be automatic origin inheritance, retain historical evidence, and preserve explicit user-authored responsibility. Codex is the recorded actor; no human-only authority is assumed. **Q:** What is the release acceptance criterion? **A:** Delegated agent decision under the user's explicit autonomous authorization. Recommended option selected: Every finding has a verified disposition and the installed My Board journey passes. Rationale: Includes targeted regressions, transport parity, real UI, English Help/resources, authenticated proof, and no unacknowledged KG failure. Codex is the recorded actor; no human-only authority is assumed."
