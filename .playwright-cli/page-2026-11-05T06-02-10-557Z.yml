                - paragraph [ref=f2e3737]: "Refinamento técnico saturado para simplificação de Delivery com recibo humano automático e íntegro; pronto para derivação após validação e Evidence. ## Parent Ideation Context - Title: Delivery da Task: estado único, motivo e próxima ação; auditoria em Details - Version: 26 ### Description Reavaliação específica da aba Delivery da Task normal/bug e da Test Card na versão 0.4.3 instalada. Complementa a iniciativa anterior, cujo resumo de Delivery está no contexto da Spec. Investigação e proposta; nenhum código ou gate alterado nesta reavaliação. ## Diretrizes explícitas do usuário > A necessidade de informação de recibo para o usuário não deve ser uma imposição. Recibo é necessário para o agente e não deve ser necessário para o humano. Isso é uma demanda sistêmica que não deve onerar o usuário na UI. > a propria aplicacao deve gerar um recibo na submissao do usuário para manter a integridade Zero campos ou associações obrigatórias de recibo para o humano. A própria aplicação gera o recibo de cada submissão humana aceita e o vincula automaticamente; agentes continuam responsáveis pelos registros de sua execução técnica. Esta regra substitui a hipótese de delegar ao agente a emissão do recibo de uma submissão humana. O emissor desse recibo é a aplicação. Ideação relacionada: `d6ffc2b3-94c3-4b43-accd-3503c93076aa`. ## Recibo automático da submissão humana Cada submissão humana aceita recebe um recibo nativo gerado pela própria aplicação, sem dependência de agente, preenchimento humano ou chamada separada. A aplicação atesta recebimento e persistência do conteúdo submetido pelo ator autenticado. O tipo e a origem distinguem submissão humana de execução técnica observada por agente. Dados do recibo: ID gerado pelo servidor; ator obtido da autenticação; data/hora do servidor; tipo da ação e origem humana; board/entidade/edição/versões; conteúdo ou referência imutável ao conteúdo e hash canônico; correlação/idempotência; resultado e vínculo ao evento/entrega pertinente Dados, recibo e vínculo auditável são persistidos atomicamente; falha de geração impede confirmar sucesso da submissão. Reenvio do mesmo comando idempotente devolve o resultado e recibo existentes; não duplica registros. Correções ou revogações geram novos eventos vinculados e preservam a versão anterior. Tentativa rejeitada pode ser auditada como rejeitada; não emite recibo de submissão aceita. Confirmação visual apenas após persistência confirmada; interrupção/retry recupera o mesmo resultado. Uma ação Enviar/Salvar e uma confirmação simples. Recibo e identificadores aparecem apenas em consulta opcional de auditoria. O recibo comprova a submissão e sua integridade. O efeito da submissão no lifecycle segue sua autoridade e regras; declaração humana não se transforma em execução técnica observada por agente. ## Diagnóstico observado - F1: A abertura normal mostra Implementation e Verification em percentuais, mas não um veredito consolidado. A conclusão só fica disponível na leitura de diagnóstico. Evidência: DeliveryReadinessView usa title apenas de current.delivery_state; a projeção padrão fornece PersistedReadinessSummary com métricas, population_known e evaluation_complete, sem delivery_state, lifecycle, motivo ou ação. - F2: O caminho para registrar uma entrega aparece depois de histórico, retomada, formulário de checkpoint, impacto, lista de obrigações e aviso de bloqueio. Evidência: Reproduzido no My Board na Task 345fd902-1446-574b-9472-5b3c987ca11f; CardDeliveryDoDPanel compõe todos esses componentes antes de dod-record-button. - F3: A tela afirma Move to Done rejected sem que uma tentativa de mover para Done tenha ocorrido. Evidência: O banner dod-blocked-banner depende de gateMode blocking e unproven.length > 0; não depende do resultado de um comando. É diagnóstico antecipado apresentado como evento ocorrido. - F4: A mesma ausência de prova aparece como 0%, obrigação sem prova, contagem de bloqueio, orientação de conclusão e banner vermelho. Evidência: Readiness, DoD e banner repetem a informação com linguagem e critérios de escopo diferentes. A lista local de implementação não substitui a verificação e os outros gates canônicos. - F5: Formulários e detalhes de agente aparecem como fluxo padrão do usuário: external dirty workspace, Targets, impacto acumulado, recibos, contribuições e IDs de FR/BR/AC. Evidência: CardProgressPanel abre New checkpoint automaticamente quando gravável; DeliveryNetImpactPanel aparece mesmo vazio; formulário de prova exige associação manual por obrigação e recibo. - F6: A Test Card tem organização diferente, tutorial de três etapas, resultados vazios, duas ações de atualização e possibilidade de abrir registro sem execução elegível. Evidência: Reproduzido na Test Card fc97baae-0163-5747-ba78-8c3900e809d5. TestDeliveryOverview explica Execute/Connect/Record; CardDeliveryDoDPanel mostra Refresh e Refresh evidence. - F7: A aba monta uma leitura ampla de evidências da Spec, além da projeção da Task e leitura de configurações do board, para apresentar o estado inicial. Evidência: useEffect de CardDeliveryDoDPanel chama getDeliveryEvidence e getBoard; DeliveryReadinessPanel mantém sua própria leitura. Históricos e retomada já usam abertura sob demanda em parte: preservá-los e consolidar a navegação, sem atribuir-lhes custo automático inexistente. ## Experiência revisada 1. Tela inicial com um único cartão de estado: ícone acessível, título direto, motivo curto e uma próxima ação principal contextual. Exibir o resultado da entrega e, quando útil, o último progresso em uma linha atribuída e datada. Formulários ficam fechados até a intenção explícita. 2. Eliminar percentuais, barras duplas, contagens de causas, IDs e banners repetidos da visão padrão. Titles de requisitos e evidências continuam em Details. Não reduzir a semântica a porcentagem nem inferir entrega do status Done. 3. Details recolhido contém requisitos, resultados, histórico e auditoria. Recibos são consulta técnica opcional e somente leitura para o humano; nenhum fluxo de negócio depende de abrir Details, selecionar recibos ou associar evidência. Links profundos preservam foco e contexto. Help central e contextual explicitam essa divisão de responsabilidade. 4. Registrar progresso humano solicita apenas linguagem de trabalho: o que avançou e o que falta. Metadados técnicos de código, escopo, revisão e recuperabilidade são capturados pelo agente/sistema. Um relato humano sem esses metadados permanece relato; o sistema não inventa ausência de mudança nem comprovação. O protocolo técnico conserva os campos exigidos e a invalidação de provas cabível. 5. Alterar obrigatoriedade vira ação secundária: Required/Optional/Waived e justificativa opcional. Se aplicável, badge textual discreto mostra que a Task não é obrigatória. A mudança nunca se apresenta como entrega ou aprovação técnica e mantém sua autoridade humana. 6. Na submissão humana, a própria aplicação gera e vincula automaticamente um recibo nativo, junto com a gravação do conteúdo. O humano não informa, escolhe ou associa recibos, inclusive em relatórios e conclusão. O agente mantém a responsabilidade pelas evidências de sua execução técnica. O sistema valida origem, conteúdo e vínculos de cada tipo sem confundir declaração humana e execução de agente. 7. Concluir Task expressa uma ação humana autorizada; a aplicação registra atomicamente a submissão aceita e seu recibo, usando a comprovação pertinente já disponível. Se outra regra exigir validação técnica ainda pendente, a UI apresenta essa pendência e seu responsável. A geração do recibo humano é automática e não depende de o agente estar disponível. A ação humana não exige IDs de recibos nem uma segunda operação. Erro de comando só aparece após tentativa real. 8. Task normal, bug e Test Card compartilham hierarquia visual. Test Card usa linguagem de execução e verificação; implementação não aplicável não vira barra vazia. Execução finalizada com falhas não se apresenta como entrega comprovada. 9. Uma única ação Atualizar coordena os dados utilizados. Não manter dois botões independentes atualizando fragmentos que podem divergir. Estados atualizando, indisponível e histórico ficam explícitos, sem sucesso baseado em dados antigos. 10. Para o humano, a ação padrão é acompanhar a entrega, ver resultado, revisar uma decisão de negócio ou alterar obrigatoriedade. Formulários de recibos, contribuição por obrigação, seleção de execuções e revisão-base ficam fora desse fluxo, inclusive sob Details. Toda exceção de coleta indisponível mantém autor, origem, causa e estado honestos no sistema. ## Responsabilidades e integridade 1. Core conserva o avaliador e as regras de autoridade como única origem. A projeção persistida guarda context.delivery_state, prova, lifecycle e motivo; expor um resumo limitado desses fatos com freshness, edição, versão e escopo, em vez de criar heurística no React ou exigir o diagnóstico completo no carregamento padrão. 2. Community apresenta TaskDeliverySummary, ações humanas de negócio e auditoria opcional em leitura. O editor técnico de recibos e o modo onStage não podem continuar sendo pré-requisito do relatório ou da conclusão humana. Separar o protocolo do agente da intenção humana; o servidor compõe vínculos e registros aceitos, sem alterar atomicidade, CAS ou idempotência. 3. Ações autorizadas dependem do ator e das regras atuais; não persistir permissões específicas de um ator como verdade global da projeção. Links de próximo passo são orientações; comando final reautoriza e refaz o fence de versão/edição. 4. Uma consulta inicial limitada ao resumo da Task é a meta de leitura da aba, sem contar o carregamento geral do modal. Permissões/configurações compartilhadas vêm do contexto já existente quando coerente. Diagnóstico detalhado, candidatos, ledger e páginas de histórico são consultados apenas ao abrir. Medir requisições/bytes/latência antes/depois; não afirmar economia de MCP com base apenas no número de componentes. 5. REST da UI recebe conteúdo e intenção humana autenticada sem exigir recibos ou IDs fornecidos pelo usuário. O serviço Core autoriza a operação e a Community persiste dados, recibo de submissão e vínculos na mesma transação. Ator e relógio vêm do servidor; conteúdo/versionamento, origem e hash canônico permitem auditoria. Captura de execução em repositórios permanece no ambiente do agente, por protocolo distinto. A geração de recibo da submissão humana funciona sem agente conectado. 6. Resources do agente devem explicitar: obter/registrar recibos no próprio ambiente, associar provas automaticamente quando o contexto for inequívoco, resolver ambiguidades técnicas e não pedir ao humano recibos/IDs/Targets. Usar o lote final composto existente e atualizações por eventos materiais; não adicionar chamadas MCP de heartbeat, duplicação de comentários ou consultas por componente de UI. 7. Recibo de submissão humana é emitido pelo servidor com correlação e idempotência na mesma operação de escrita, sem chamada MCP adicional. Não confiar em IDs, autor ou timestamp informados pela UI como autoridade. Vincular o recibo ao registro/entrega apropriado no mesmo commit; revisões e revogações preservam o histórico. Registro autenticado e hash de conteúdo não são, por si só, alegação de execução técnica nem promessa de inviolabilidade absoluta. ## Critérios de aceitação 1. Ao abrir Delivery, o usuário identifica o estado da entrega, a pendência principal e a próxima ação sem abrir Details ou preencher formulários. 2. Há no máximo um CTA primário e uma atualização coordenada. Zero controles obrigatórios de recibos no fluxo humano, tanto no resumo quanto em Details, progresso, relatório e conclusão. 3. Check de Entregue exige qualificação atual canônica; 100%, status Done, checkpoint, dispensa e execução de teste com falhas não produzem sucesso falso. 4. Dados ausentes, não aplicáveis, em atualização e contraditórios têm apresentação própria; não são apresentados como zero confirmado ou aprovados. 5. Uma submissão humana aceita gera recibo nativo automaticamente mesmo sem agente disponível. Falta de prova de execução ou associação técnica necessária continua como pendência do responsável técnico, sem pedir recibos ao humano; os dois tipos de registro têm origem e autoridade explícitas. 6. Progressos, autoria, timestamps, vínculos, revisão/edição, provas rejeitadas e decisões humanas continuam consultáveis; preservação de draft em mudanças de base, idempotência e concorrência seguem testadas. 7. Links profundos para causas, provas e registros antigos abrem Details no local correto, com teclado, foco e retorno adequados. 8. Help central, ajuda contextual e resources explicam que a aplicação gera o recibo de submissões humanas e que o agente cuida das evidências de sua execução. A auditoria é consulta opcional; nenhuma jornada humana exige informar ou associar recibos. 9. Testar Task normal, bug e Test Card, com permissões distintas, sucesso, falta de implementação, falta/falha de teste, gate adicional, dispensa atual/antiga, Done histórico e projeção indisponível. 10. Medir a redução de blocos visíveis, requisições e bytes na abertura da aba; históricos já paginados continuam paginados. Não carregar toda a Spec para mostrar o resumo de uma Task. 11. Testar a jornada humana completa sem conhecer nenhum ID de recibo: acompanhar, registrar relato, rever resultado, alterar obrigatoriedade e concluir quando autorizado. Nenhuma chamada da UI exige receipt_id/execution_id fornecido pelo humano. 12. Testar coleta pendente, agente indisponível, recibo recusado, revisão antiga e ambiguidade técnica: mensagem humana simples, responsável técnico identificado e nenhuma solicitação de recibo ao humano. 13. Testar separadamente que agentes continuam obrigados a produzir registros autênticos e que declaração/aceite humano não se disfarça de prova técnica. 14. Submissão humana válida persiste conteúdo, autoria autenticada, recibo e vínculo em uma única transação e resposta, sem ação ou chamada adicional para gerar recibo. 15. Falha entre gravação e emissão do recibo provoca rollback integral; a UI não exibe sucesso parcial. 16. Reenvio idempotente retorna o mesmo recibo e não duplica entrega, evento ou submissão; conteúdo diferente não pode reutilizar silenciosamente a mesma chave. 17. Autor e timestamp não podem ser forjados pelo cliente; alteração do conteúdo gera nova versão/recibo rastreável. 18. Uma submissão rejeitada nunca é apresentada como aceita e seu eventual registro de tentativa tem tipo/resultado próprios. ## Precedência proposta 1. Contrato Core de recibo automático de submissão humana, autoridade por origem, idempotência, atomicidade e resumo de estado 2. Composição automática de registros aceitos e intenção humana sem recibos, incluindo relatório e conclusão 3. UI de acompanhamento e auditoria opcional em leitura; retirar obrigações técnicas dos formulários humanos 4. Help central/contextual, resources do agente e regressões das duas jornadas ## Estados e ações humanas - Em andamento — entrega pendente: O agente responsável está finalizando a entrega e sua confirmação. Ver andamento. Coleta ou vinculação de recibos é obrigação do agente/sistema, sem etapa manual para o humano. - Entrega aguardando verificação: O responsável pela verificação ainda precisa confirmar o resultado. Ver andamento da verificação ou a Task responsável. Nenhum pedido de execução autenticada ou recibo ao humano. - Validação encontrou falhas: Há resultado de verificação que exige correção. Ver o problema e o responsável pela correção; o agente/sistema coleta os resultados da nova verificação. - Pronta para concluir: Provas atuais completas; conclusão ainda não realizada. Concluir Task pela transição autorizada, sem informar ou selecionar recibos; revalidar prova e permissões internamente. - Entregue: Entrega qualificada e conclusão confirmada na edição atual. Ver entrega, com check verde acessível. - Não obrigatória para esta entrega: Decisão humana atual de Optional/Waived. Não conta como trabalho entregue. Ver decisão ou alterar obrigatoriedade, conforme autorização; preservar estado real do trabalho. - Status da entrega ainda não confirmado: Os dados estão sendo atualizados ou não puderam ser avaliados. Aguardar ou tentar novamente; nunca mostrar check de entrega atual a partir da geração anterior. - Concluída anteriormente — entrega requer confirmação: A conclusão histórica permanece registrada; o sistema está verificando a confirmação atual. Ver andamento. O responsável técnico trata a confirmação sem pedir recibos ao humano. ## Mockup e Q&As Mockup sm_1cee4754 atualizado. Recibo humano emitido pela aplicação como efeito automático da submissão aceita; auditoria opcional em Details. Q&As preservam alternativas históricas e respostas registram as instruções explícitas do usuário. Proposta em Draft; implementação instalada não alterada nesta atualização. ## Saturação e autorização para derivação — 2026-11-03 O usuário solicitou expressamente validação, saturação, derivação até Spec e Tasks prontas para execução. Recomendações selecionadas serão adotadas no planejamento; esta etapa não inicia implementação. Revisados: autoridade humana versus técnica, rollback atômico, retry sem duplicação, CAS, falha/ACL sem falso sucesso, histórico e correções, Task/Test Card, relatório de conclusão, Help e custo de leituras. KG Stage 1: nenhuma decisão similar ou bug retornado; descoberta global trouxe decisões de dispensa humana, relacionadas apenas por auditoria, sem impor mudança de escopo. Arquitetura nativa validada sem avisos; mockup existente mantém o fluxo humano sem recibos. ### Problem Statement A tela de Delivery transfere ao usuário a operação de um protocolo técnico de recibos, provas e vínculos que pertence ao agente e ao sistema. O humano precisa acompanhar entrega, pendências e andamento e tomar decisões de negócio sem conhecer ou fornecer recibos. A UI também mistura resumo com auditoria, progresso e impacto. ### Proposed Approach A própria aplicação gera e vincula o recibo de cada submissão humana aceita na mesma transação e resposta, com identidade autenticada, conteúdo/versionamento, origem e idempotência. Não exige agente intermediário, formulário técnico ou segunda ação humana. A UI exibe confirmação simples; Details permite auditoria opcional. Evidências de execução do agente conservam tipo e autoridade próprios. Help e resources explicam esse contrato. ### Scope Assessment - Domains: 3/5 - Ambiguity: 1/5 - Dependencies: 2/5 - Complexity: large ### Q&A Decisions **Q:** Qual deve ser a informação principal ao abrir Delivery da Task? **A:** Estado único + motivo curto + próxima ação (Recomendada). Adotada no planejamento pelo Codex sob autorização atual do usuário para saturar, validar e derivar Spec e Tasks. Não inicia execução. Preserva rastreabilidade e gates. **Q:** Onde devem ficar checkpoints, impacto, obrigações, recibos e histórico? **A:** Diretriz explícita do usuário nesta conversa: recibos são necessários ao agente e não podem onerar o humano. Details permanece como consulta opcional de auditoria, somente leitura para recibos. A seleção da opção sobre Details não autoriza exigir recibos nem colocar um formulário técnico obrigatório atrás da expansão. Formulários humanos recebem apenas informações e decisões de trabalho; o agente/sistema coleta os metadados e provas técnicas. **Q:** Como simplificar o registro de entrega sem reduzir a prova exigida? **A:** Definição explícita do usuário nesta conversa: a própria aplicação deve gerar um recibo na submissão do usuário para manter a integridade. A opção selecionada passa a significar: o fluxo humano envia/salva o conteúdo normalmente; a aplicação autoriza, persiste, emite e vincula o recibo automaticamente na mesma transação e resposta, sem agente intermediário, campos técnicos ou chamada adicional. O recibo registra ator autenticado, data do servidor, ação/origem, conteúdo e versão, vínculo e correlação/idempotência. Reenvio do mesmo comando recupera o mesmo recibo; erro na gravação não confirma sucesso parcial. Details oferece consulta opcional. Esse recibo atesta a submissão humana; os recibos de execução técnica do agente mantêm sua autoridade e origem distintas. **Q:** Como manter consistência e baixo custo na nova visão? **A:** Resumo canônico limitado + detalhes sob demanda + atualização coordenada (Recomendada). Adotada no planejamento pelo Codex sob autorização atual do usuário para saturar, validar e derivar Spec e Tasks. Não inicia execução. Preserva rastreabilidade e gates."
