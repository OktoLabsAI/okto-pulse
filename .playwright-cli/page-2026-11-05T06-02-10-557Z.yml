                  - generic [ref=f2e3975]: Edition 1
                - heading "Unificação do estado de execução e migração de cards Started" [level=3] [ref=f2e3976]
                - paragraph [ref=f2e3977]: "Refinamento único da ideação concluída (edição 2, versão 23): unificar Started em In Progress em todos os tipos de card e migrar automaticamente estados persistidos de boards legados. Sem alias API/MCP. Investigação e saturação em andamento; preservar gates, autorização, histórico e evidências. Nenhuma implementação ou migração de dados operacionais é executada nesta etapa. ## Parent Ideation Context - Title: Unificar Started e In Progress em todos os tipos de card - Version: 23 ### Description ## Objetivo Unificar Started e In Progress em todos os tipos de card que expõem Started. O único estado ativo de execução será in_progress, apresentado como In Progress. ## Decisões do usuário — interpretação corrigida em 22/10/2026 - Abrangência: todos os tipos de card, conforme Q&A 52908c76-3631-4821-acea-e6bed97285bf. - Ao iniciar/carregar um board com dados antigos, migrar automaticamente os cards cujo estado atual seja started para in_progress. - A compatibilidade é com dados persistidos. O usuário esclareceu que não haverá agentes antigos enviando started. Não criar alias na API/MCP nem suporte à sequência legada started → in_progress. - Incluir comentário no código que trata STARTED indicando remoção na próxima versão, conforme pedido original. - O Q&A 55c2ff00-9a9d-43cb-8aaf-f71268d747fd foi corrigido com atribuição ao esclarecimento do usuário. - A pergunta adicional sobre migrar ou colocar cards em On Hold foi retirada: a orientação é migração automática para In Progress. A preservação dos gates é requisito técnico da solução, sem condicionar a conversão a uma nova decisão manual. ## Problema e valor esperado Dois estados próximos de execução acrescentam uma transição e uma distinção operacional para usuários e agentes. A inspeção preliminar do código confirma que Started participa de transições, permissões e gates, além da apresentação. O ganho esperado é maior clareza e uma operação a menos no início de tasks comuns. Não há medição que sustente promessa de maior throughput do banco ou do KG. ## Encaixe na solução 1. **Migração de dados:** reconhecer started na preparação/atualização dos dados legados do board e persistir in_progress antes de disponibilizar o fluxo operacional. A conversão deve ser automática, transacional e idempotente; uma nova inicialização não repete efeitos. Não executar essa conversão como efeito colateral de uma simples consulta GET. 2. **Contratos novos:** UI, API e MCP usam o estado canônico in_progress. Remover Started das opções, schemas de novas operações e documentação ativa. A leitura de históricos pode continuar reconhecendo o valor antigo. 3. **Histórico:** preservar transições anteriores, datas reais de início, evidências, relatórios e percentuais. Registrar a conversão como migração de dados, sem simular trabalho realizado, aprovação ou nova execução pelo agente. 4. **Gates de execução e entrega:** unir os controles aplicáveis à entrada em In Progress. A migração não produz comprovação de que requisitos foram cumpridos. Reavaliar os requisitos necessários antes de permitir avanço posterior, mantendo pausa/cancelamento disponíveis. Done continua sujeito à entrega e verificação das obrigações aplicáveis. 5. **Permissões:** reconciliar a transição direta not_started → in_progress nos presets e perfis personalizados sem conceder execução a quem só possuía autorização parcial de preparação. 6. **Criação e demais transições:** atualizar criação de cards, retomada, retorno ao planejamento e validação de bugs para o fluxo unificado. Não aceitar criação direta em estado avançado por simples atribuição que contorne os gates. Validation permanece conforme a política vigente do board. 7. **Projeções e interfaces:** atualizar Kanban, detalhes, filtros, analytics, contratos de agentes e projeções duráveis no KG a partir da alteração confirmada, sem reconstruir evidências de entrega. 8. **Remoção posterior:** o comentário solicitado deve distinguir o código operacional temporário de STARTED da migração versionada. Retirar o estado operacional na próxima versão não pode tornar ilegível um board antigo que só seja aberto depois ou uma instalação que pule versões. Preservar o caminho necessário para atualizar esses dados. ## Risco concreto identificado no código Em services/main.py:6618, o gate de regressão de bugs depende de cruzar o nível anterior para o nível de execução e pressupõe que um card já em In Progress passou pelo gate. A conversão de um card Started não pode virar uma isenção implícita desse controle nos avanços posteriores. Outras referências preliminares: domain/sdlc_registry.py:395 (transições), domain/permissions.py:864 (permissões por aresta), services/main.py:3438 (status inicial permitido). Estas referências orientam o refinamento; não constituem evidência formal de implementação. ## Critérios candidatos de aceitação - Ao inicializar um board legado, todos os cards atualmente em started são persistidos como in_progress e exibidos como In Progress. - Reiniciar ou repetir a migração não duplica eventos nem altera novamente datas, histórico ou evidências. - Uma falha de migração não deixa o board parcialmente convertido ou operacional com interpretação ambígua. - Novas operações usam in_progress; started não é aceito como alias. - Cards migrados não ganham entrega, verificação ou dispensa de pré-requisitos pela conversão. - Tasks, tests e bugs mantêm os controles específicos de execução e conclusão. - Testes abrangem dados legados, repetição/reinício da migração, permissões, retomada, criação, projeções e upgrade que pula versões. ## Consulta ao conhecimento existente Em 22/10/2026: KG health retornou graph_state=at_risk, com métricas indisponíveis por orçamento de observação. As consultas de decisões semelhantes, conhecimento global e aprendizados de bugs tiveram sucesso e zero resultados. Isso não comprova ausência de histórico fora do recorte consultado. ## Estado da iniciativa Conteúdo consolidado para avaliação e derivação por solicitação do usuário. Versão de entrega será definida no planejamento, sem alterar o escopo funcional. Não há dependência externa nova. Mockups específicos são dispensáveis nesta ideação: a superfície é o Kanban e os controles existentes de status, com remoção de Started. O desenho detalhado da migração, reconciliação de permissões e testes será formalizado no artefato derivado, usando os mecanismos existentes do produto; não há nova arquitetura ou infraestrutura proposta. Este registro não executa migração nem altera cards do board okto-grafx. ### Problem Statement Started e In Progress dividem o trabalho ativo dos cards em dois estados e exigem uma transição adicional nas tasks comuns. Unificar os estados em todos os tipos de card, removendo uma etapa operacional sem perder controles de execução, entrega e verificação. Boards com dados antigos devem continuar utilizáveis: cards atualmente em started serão automaticamente migrados para in_progress na inicialização/preparação dos dados, preservando histórico e evidências. ### Proposed Approach Adotar in_progress como único estado ativo de execução em todos os tipos de card. Executar migração automática, transacional e idempotente do estado atual started em boards legados antes de disponibilizar o fluxo operacional, sem tratar migração como aprovação nem como relato de execução. Manter histórico e caminho de upgrade para instalações que pulam versões. Atualizar transições, gates, permissões, criação, retomada, UI, API/MCP, filtros, analytics e projeções pelos mecanismos existentes. Não oferecer alias started em novas chamadas. Preservar controles de conclusão e reavaliar requisitos aplicáveis dos cards migrados antes de avanço posterior, mantendo pausa/cancelamento disponíveis. Incluir comentário para remoção do tratamento operacional temporário de STARTED na próxima versão, distinguindo-o da migração versionada necessária a dados antigos. Verificar a conversão, repetição/reinício, integridade do histórico, permissões, gates por tipo e projeções. Versão de entrega e detalhes de execução pertencem ao planejamento/artefato derivado. ### Scope Assessment - Domains: 2/5 - Ambiguity: 1/5 - Dependencies: 1/5 - Complexity: medium ### Q&A Decisions **Q:** Qual deve ser a abrangência da remoção de Started? A solicitação menciona tasks; outros tipos de card podem compartilhar o mesmo estado e contratos. **A:** opt_1 **Q:** Como tratar clientes e agentes que ainda enviam started pela API/MCP após a unificação? Em qualquer opção, a conversão não deve contornar os gates de entrada em In Progress; o histórico original deve ser preservado. **A:** Esclarecimento explícito do usuário em 22/10/2026, registrado pelo agente: a compatibilidade é exclusivamente com dados persistidos. Ao iniciar/carregar um board com cards antigos em started, migrar automaticamente seu estado atual para in_progress. Não haverá agentes antigos enviando started. A opção de rejeitar started em novas chamadas representa essa correção: não haverá alias na API/MCP. A seleção anterior de alias decorreu de uma interpretação incorreta do agente e está substituída. Mantém-se o pedido de comentário no código de tratamento de STARTED para remoção na próxima versão; no refinamento, distinguir a remoção do estado operacional da manutenção do caminho de upgrade para dados antigos. A migração é de estado atual, preservando histórico, evidências e regras de entrega/verificação."
