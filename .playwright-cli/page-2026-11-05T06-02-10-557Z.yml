                - heading "Readiness persistido — invalidação durável, projeção assíncrona e cobertura coerente" [level=3] [ref=f2e3937]
                - paragraph [ref=f2e3938]: "Refinamento brownfield do fluxo completo de percentuais: reduzir reconstrução por leitura preservando prova, gates nativos, autorização e durabilidade. Inclui contratos, recuperação, compatibilidade de armazenamento, UI e carga de aceitação. Apenas planejamento; implementação e instalação posteriores. ## Parent Ideation Context - Title: Percentuais de implementação e verificação rápidos, persistidos e consistentes - Version: 16 ### Description ## Objetivo e escopo confirmado Melhorar leitura e atualização dos percentuais no Kanban, Delivery dos cards, Spec e Coverage by obligation. Tasks/Bugs usam suas contribuições; Test Cards usam cenários e mantêm implementação N/A; Spec agrega obrigações únicas, sem média dos cards. REST e MCP devem expressar o mesmo significado. O usuário solicitou planejamento, saturação e validação até o refinamento. A iniciativa preserva as regras de prova e de Done, o histórico e a restrição de não alterar o board okto-grafx em execução. ## Observação técnica preliminar — 23/10/2026 Baselines locais limpos: Core 35ed6d6311fd609ab35bfd30ea407f34b110817b; Community 83e2c44fdab7621c6aeaf4c0b9ef174388e7f69f. CommunityDeliveryReadinessReader._load_transaction carrega Cards, ledgers, histórico da Spec, Targets, execuções e receipts; monta fatos e fingerprint. load usa leitura transacional e repete quando PRAGMA data_version muda. DeliveryReadinessService.board_summary compartilha avaliação por Spec, mas cada context também compõe diagnósticos. useBoardDeliveryReadiness já agrupa por Spec, com até 3 requests concorrentes, e atualiza ao receber foco/eventos/alterações de cards. Isso identifica trabalho repetido candidato à otimização; não constitui perfil de CPU ou medição p95. A investigação formal de código e seus limites serão registrados no refinamento. ## Coerência e confiança Uma implementação comprovada pode existir com verificação pendente/falha. Falha de um teste afeta somente as obrigações e contribuições que dependem dele. Unknown não vira 0 e N/A não vira 100. Percentual e linhas exibidos juntos precisam compartilhar revisão e denominadores completos. Progresso textual/parcial não ganha crédito de prova. Uma autorização humana continua explícita e não aumenta o percentual. Done deve confirmar prova e política atuais; resultados antigos de leitura nunca autorizam conclusão. Leitura não reabre cards concluídos nem altera evidências. ## Decisões confirmadas pelo usuário em 23/10/2026 Q&A 7096cd99-53ed-4e00-8402-344857c60738: local-user selecionou opt_0 — atualização automática em segundo plano, com Atualizando explícito e total/tabela da mesma revisão. O report confirma a gravação durável; Done continua sujeito à prova atual. Q&A ab3e40b1-8b32-441c-9c24-ff5619014791: local-user selecionou opt_0 — resumo persistido p95 ≤ 200 ms, tela com percentuais ≤ 1 s, atualização p95 ≤ 1 s normalmente e ≤ 5 s em rajada. São critérios de aceitação para a implementação, não resultados medidos. ## Consulta de conhecimento KG do board: graph_state=at_risk, metric_status=unavailable por orçamento de observação; discovery_state=healthy. A triagem foi executada: decisões semelhantes=0; aprendizados de bugs em readiness=0. Consulta global retornou referências canônicas intituladas Persistência relacional e outbox do Pulse: entity_0a34ffccc4e6d5b2911b7ae6, entity_4201004bc16375f73bd8553d, entity_59989bac214af88a2a2865c4, entity_7aac80047b0ba1056031cbd3, entity_84d36b16f7f06a73299cc74e. São entidades de contexto, não decisões que aprovem esta solução. Verificar o contexto associado no refinamento. Resultados vazios não provam ausência universal de histórico. ## Limites Nenhuma alteração das fórmulas, critérios de validade das provas ou política de Done. Sem novo serviço externo, Redis ou dependência do KG para calcular readiness. Versão de entrega e instalação serão decididas na execução posterior. A validação desta etapa avalia o planejamento; não declara a melhoria implementada ou os SLOs atingidos. ## Plano consolidado As decisões de produto foram confirmadas nos Q&A. As escolhas técnicas abaixo dão suporte a essas decisões e serão detalhadas e confrontadas com evidências no refinamento. ### Solução e invariantes - D1. Fonte de verdade continua nos ledgers e contratos de prova existentes. A projeção é derivada e reconstruível; percent não é campo livre editável no Card. - D2. Projeção por Spec/edição com linhas próprias de Card e obrigação/cenário; contagens completas e independência por fase. Primeiro recalcular a Spec afetada uma vez por lote coalescido, reaproveitando a avaliação compartilhada. Deltas por obrigação ficam para otimização posterior, se o perfil justificar. - D3. Persistir fonte, revisão de invalidação e obrigação de processamento na mesma transação curta. Reutilizar o publisher transacional de DomainEvent; não o KG EventBus que abre sessão separada e absorve falhas. - D4. Worker dedicado a readiness, independente de KG/global outbox. Claim curto, coleta em snapshot de leitura, liberação de sessão/conexão, cálculo de DTOs imutáveis fora da transação, publicação curta. Não compartilhar AsyncSession entre tarefas. - D5. Geração monotônica por Spec e versão do avaliador. Worker antigo nunca sobrescreve uma geração mais nova; fonte avançada mantém dívida pendente. Sob mudanças contínuas, é permitido publicar um snapshot coerente anterior explicitamente Atualizando, sem alegar current, para não descartar todo trabalho indefinidamente. - D6. Publicar ponteiro ativo, totais e unidade/tabela como uma geração. Detalhes/paginação pinam geração e escopo; expiração retorna conflito de snapshot, nunca concatena páginas de gerações diferentes. GET não enfileira nem repara. - D7. Autorização e gates de lifecycle são reavaliados para o ator corrente; facts projetados são separados de permissões e ações. O resumo não anuncia elegibilidade de transição quando não avaliada. Done mantém os gates nativos e a atomicidade do report composto, sem depender do sucesso do worker. - D8. UI preserva último resultado coerente identificado como anterior quando houver atraso. Sem geração anterior, mostra Aguardando cálculo, sem 0 fabricado. Erro explicita atualização indisponível; N/A e unknown continuam distintos; falha localizada mantém fase/escopos independentes quando há fatos suficientes. - D9. Compatibilidade faz parte do escopo: o armazenamento atual admite fingerprint exato e não atualiza schema existente. Introduzir uma atualização aditiva explícita e versionada, restrita ao predecessor conhecido, sob lock exclusivo antes da admissão normal; backup consistente e verificação antes/depois, transação DDL, sem reescrever evidências ou contornar triggers. Formatos desconhecidos continuam recusados. - D10. Backfill por páginas e checkpoint durável, iniciado por instalação/startup controlado, sem bloquear a UI até calcular todos os boards. Reconciliação limitada detecta revisão pendente/projeção ausente ou versão obsoleta; reparação refaz dados derivados, não inventa prova. - D11. Nenhuma mudança em fórmula, escopo de contribuição, validade de execução, exceção humana, policy gate, independência de revisão ou interpretação de histórico. Expiração de preflight não apaga crédito histórico de entrega; temporalidade só invalida onde o contrato atual já determina. - D12. Manter WAL + synchronous=FULL já configurados; não trocar durabilidade por performance. Cálculo e espera de KG não participam das novas transações curtas de readiness. ### Matriz de mudanças que afetam readiness - report/associação de implementação ou teste, batch e report composto: invalidar no commit, rollback não deixa evento; replay exato não duplica obrigação. - novo resultado autenticado de cenário, inclusive failed antes da associação: invalidar Spec e consumidores dependentes da prova. - revogação/NA/waiver e inspeções de Decision: preservar significado atual por fase e reavaliar consumidores afetados. - Target alterado/inativo, execução substituída, receipt revogado, progresso material: mapear source/target/execution para Specs dependentes; nada de invalidar todos os boards por padrão. - conteúdo semântico/edição, requisitos/obrigações, links Task/Scenario, responsabilidade herdada, rebase: invalidar a Spec e também origem/destino quando o card muda de Spec. - arquivar, restaurar, excluir ou mudar tipo/status: invalidar população e/ou resumo lifecycle conforme efeito real; tombstones evitam ressurreição. - mudança de política/ACL: revisão específica de política ou autoridade. Verificar acesso atual antes de ler e antes de devolver conteúdo; uma mudança global de preset alcança só os escopos mapeados. - mudança da versão do avaliador/schema: geração incompatível fica indisponível e backfill durável calcula a nova. - vencimento temporal realmente consumido pelo avaliador: valid_until e agenda durável; sem relógio artificial que expire commits históricos. ### Critérios de aceitação - Paridade exata de contagens, percentuais, status de fases, identidade das unidades e exceções com o avaliador atual para o mesmo snapshot. - Total da Spec e tabela correspondem à mesma geração; progresso local de Card preservado mesmo quando obrigação global ainda está incompleta. - Test Card I=N/A, V por cenários vinculados; Task/Bug I/V por contribuições; Spec por obrigações únicas. - Sem recálculo da população, leitura de histórico completo ou diagnósticos completos no caminho de resumo quente. - Sem consulta ao KG e sem espera de KG para fonte/report, projeção ou leitura de percentuais. - Crash antes do commit: sem mudança/intent; depois do commit antes do worker: intent recuperável; depois da publicação antes do ack: replay idempotente. - Eventos duplicados e fora de ordem, dois workers, perda de lease, revogação durante cálculo e atualização concorrente nunca publicam progresso falso como atual. - Worker indisponível, banco cheio ou erro de avaliação nunca devolvem sucesso fictício: a fonte confirmada permanece durável, com atualização pendente/erro explícito. - Requests de escopo independente e fase independente não falham por arrasto. Falha de fonte comum pode legitimamente tornar ambas as fases unknown. - Done após leitura de 100/100 e posterior revogação é recusado conforme política atual; snapshots e cursores não autorizam mutações. - Permissões revogadas não vazam valor, detalhe ou ação; isolamento por realm/board/card, inclusive paginação e cache do browser. - Backfill retomável, rollout em armazenamento existente sem perda, rollback operacional explícito e paridade após restart. - Teste de churn em outro board não causa retry da Spec por data_version global; alterações relevantes provocam revisão correta. - Logs/metrics de latência e fila não incluem texto de evidências ou credenciais. ### Marcos propostos - M1 — Baseline e contrato: medir fases e inventariar mutações; congelar corpus/paridade, SLOs, orçamento de carga e esquema de frescor. - M2 — Persistência e compatibilidade: modelo de revisão/geração/linhas, atualização aditiva controlada, índices e invalidação transacional em todas as rotas. - M3 — Worker e durabilidade: coalescência, scheduler justo entre Specs, snapshot de fatos, publicação atômica, retry/backoff e retomada. - M4 — API/MCP/UI: resumo leve, detalhes por geração, tabela de obrigações e fases coerentes, atualização automática e estados de erro/N/A. - M5 — Robustez e gates: crash/replay/concorrência, autorização e Done com prova alterada; reconciliação e backfill. - M6 — Performance e entrega: baseline vs candidato com percentis, writer latency, WAL/pool/CPU/fila, validação do rollback e instalação somente em janela autorizada. ### Medição planejada Separar aquisição de conexão, queries, materialização dos fatos, avaliação canônica, diagnósticos e serialização; medir p50/p95/p99, retries, CPU, memória, retenção de conexão, transação de escrita e atraso da fila. Corpus isolado e determinístico: Task/Bug/Test, Spec com contribuições compartilhadas, eventos de revogação e evidência incompleta. Executar carga normal e rajadas, múltiplos leitores, mudanças relevantes e mudanças em outro board. Publicar hardware, versões, quantidade de Specs/cards/obrigações/evidências, duração e amostras; excluir aquecimento do percentil quente e publicar cold start separadamente. SLOs aprovados constam no Q&A; não há resultado medido. A análise deve comparar a mesma carga e provas antes/depois, incluindo a latência de gravação para não transferir a lentidão para o report. ### Riscos e mitigação - Invalidação incompleta: matriz de escritores por entidade, testes de cada mutation path e reconciliação limitada. - Contagem divergente: reutilização do avaliador Core e comparação de resultado inteiro por revisão. - Resultado atrasado sobrescrevendo atual: revisão monotônica, lease/epoch e publicação condicional. - Fila monopolizada por uma Spec: coalescência com espera máxima, limites de lote e escalonamento justo. - Escrita lenta: não avaliar ou consultar KG na nova transação; staging por geração para grandes populações. - Vazamento por cache: autorização atual em cada leitura, escopo por realm/board e limpeza do cache ao trocar identidade. - Regressão de instalação: formato predecessor conhecido, backup/verificação e atualização aditiva transacional antes da admissão do schema. - Expiração incorreta: não confundir TTL de preflight com validade histórica de prova entregue. ### Alternativas avaliadas Campo percent isolado no Card perde denominador, proveniência e dependências; não recomendado. Cache apenas em memória reduz leituras temporariamente, mas não entrega persistência/recovery nem elimina reconstrução após restart; não recomendado como solução principal. Recálculo síncrono em todo report torna leitura rápida e transfere o custo para a escrita; foi preterido pelo usuário em favor da atualização automática. Projeção durável com recomputação coalescida por Spec preserva a regra única de cálculo e reduz repetições; abordagem adotada após a decisão de visibilidade do usuário. Delta incremental por unidade adiciona complexidade de invalidação; adiar até que a medição demonstre necessidade. ### Estado de saturação Os dois Q&A estão resolvidos por local-user. Escopo, comportamento, invariantes, falhas, limites e metas estão definidos. A avaliação formal desta edição verificará a coerência do planejamento; a eficácia/performance ainda deverá ser demonstrada na implementação. Arquitetura e mockup anexos serão herdados pelo refinamento. Nenhuma execução ou alteração do board okto-grafx é autorizada por este documento. ### Problem Statement Usuários relatam lentidão extrema ao carregar os percentuais de implementação e verificação dos cards. O cálculo atual reconstrói fatos e diagnósticos da Spec a cada consulta; mesmo a leitura de um card carrega o conjunto da Spec. O objetivo é disponibilizar resultados persistidos, coerentes com Coverage by obligation e atualizados após alterações de evidência, reduzindo trabalho repetido. As métricas seguem independentes, preservam unknown/N/A/exceções e não substituem os gates nativos de conclusão. ### Proposed Approach Persistir uma projeção de leitura de readiness por escopo (realm, board, Spec/edição e card), com contagens, percentuais, estado de cada fase e revisão das fontes. A fila durável será gravada na mesma transação da mudança de origem; um worker calcula fora da transação de escrita e publica uma geração coerente de totais e linhas. As regras de prova permanecem no avaliador canônico do Core, e a autorização por ator é reaplicada a cada leitura. O report confirma o commit durável sem aguardar o cálculo; a UI mostra atualização em curso e mantém o último resultado identificado. Metas aprovadas: resumo p95 ≤ 200 ms, tela ≤ 1 s e atualização p95 ≤ 1 s normal / ≤ 5 s em rajada. O refinamento fixa a carga de referência e a prova de cumprimento. ### Scope Assessment - Domains: 3/5 - Ambiguity: 2/5 - Dependencies: 3/5 - Complexity: large ### Q&A Decisions **Q:** Após um report ou alteração de evidência, os percentuais podem atualizar em segundo plano com Atualizando explícito, total e tabela publicados juntos, mantendo Done condicionado à evidência atual? **A:** opt_0 **Q:** Qual meta de desempenho devemos adotar? São alvos de aceitação propostos, ainda não medidos; a carga reproduzível e os limites serão documentados no refinamento. **A:** opt_0"
